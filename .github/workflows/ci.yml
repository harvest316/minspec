name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # #1394 — required checks must also report for a MERGE GROUP, or a merge queue can
  # never green anything. Inert until a queue is actually enabled on `main`: GitHub only
  # emits `merge_group` when one exists, so this is a no-op prerequisite, not a behaviour
  # change. It is here first precisely because enabling the queue BEFORE the triggers land
  # blocks every merge in the repo.
  merge_group:
    branches: [main]

permissions:
  contents: write

jobs:
  # #1728 — a docs-only PR cannot break a TypeScript build, yet under `strict` every
  # merge re-BEHINDs every open PR and the branch update re-runs lint/test/build in
  # full. This computes the docs-only flag ONCE; the jobs below skip their expensive
  # steps on it while still REPORTING, because lint/test/build are required checks and
  # a check that never reports leaves the PR pending forever (the paths-ignore trap —
  # same class the merge_group note below guards against).
  #
  # Single-sourced: it SOURCES scripts/lib/docs-corpus.sh (SPEC-039 INV-2, the one bash
  # definition) rather than restating the regex. docs-lane.yml keeps a copy pinned
  # byte-identical by test; this has no copy to drift.
  #
  # FAIL-SAFE: docs_only is "true" only when the change set was enumerated AND every
  # path is in the corpus. Any other outcome — not a PR, empty enumeration, git error,
  # missing lib — yields "false" and everything runs. Skipping work must require
  # positive evidence; running it never does.
  paths:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify the change set
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          lib="scripts/lib/docs-corpus.sh"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f "$lib" ]; then
            # shellcheck source=scripts/lib/docs-corpus.sh
            . "$lib"
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
            if [ -n "${files//[[:space:]]/}" ] && [ -n "${DOCS_CORPUS_RE:-}" ]; then
              outside="$(printf '%s\n' "$files" | grep -vE "$DOCS_CORPUS_RE" || true)"
              [ -z "${outside//[[:space:]]/}" ] && docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = "true" ]; then
            echo "::notice title=docs-only change::Every changed path is in the docs corpus; lint/test/build will skip their expensive steps and report green. The checks still RUN and still report."
          else
            echo "Not docs-only (or could not be determined) — running everything."
          fi

  lint:
    needs: paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        if: needs.paths.outputs.docs_only != 'true'
        run: npm run lint

      - name: Validate frontmatter
        run: npm run validate

      # SPEC-040 FR-2: fails on any RUNTIME (value-import) cycle under
      # packages/minspec/src. The known lib cycles are each held open by one
      # `import type` edge, which the compiler erases — so this ships green and
      # guards the next type→value flip that would close one for real. eslint
      # cannot see across files, so this is its own gate, not a lint rule.
      - name: Check import cycles
        if: needs.paths.outputs.docs_only != 'true'
        run: npm run check:cycles

      # Nothing else typechecks the source (#1424). `build` is esbuild, which STRIPS
      # types without checking them; `vitest` transpiles per file for the same reason;
      # and `build:shared`'s tsc covers only packages/shared. So a TypeScript error could
      # merge past a fully green suite — and did: #1423 carried a TS2339 through 240/240
      # test files and 4970 passing tests, caught by an AI reviewer rather than any gate.
      # Measured 0 pre-existing errors in both packages when this was added, so it is
      # required from day one rather than advisory-then-ratcheted.
      - name: Typecheck
        if: needs.paths.outputs.docs_only != 'true'
        run: npm run typecheck

      # Pure decision logic behind the ai-review label-integrity gate
      # (.github/workflows/ready-to-merge.yml). Lives under .github/scripts so it
      # is outside vitest's packages/* include; run it directly on Node so the
      # security-critical revert/strip/green decisions stay enforced in CI.
      - name: Unit-test ai-review label guard
        run: node --test .github/scripts/ai-review-guard.test.js

      # #1355: agent GitHub writes must carry the bot's identity, not the human's.
      # minspec#995 already required this in CLAUDE.md prose and NOTHING obeyed it
      # — 76 write call sites, zero App-token use — so the founder was recorded as
      # the author of every agent issue/comment/label/merge (and auto-subscribed to
      # each thread forever). This is the gate that replaces the prose.
      - name: Check agent GitHub writes are bot-attributed
        run: npm run check:gh-bot

      - name: Unit-test gh-bot attribution guard
        run: node --test scripts/check-gh-bot-attribution.test.js

      # The write/read predicate and the credential handling behind it. Pins that
      # the guard DERIVES its write vocabulary from gh-bot.sh rather than keeping a
      # second copy — the two disagreed once, which left `gh ruleset create` able
      # to mint at runtime while the guard never required attribution.
      - name: Unit-test gh-bot write predicate + credential handling
        run: node --test scripts/lib/gh-bot.test.js

  # Workflow-syntax + expression lint (#486 harden). CI validated YAML syntax but
  # NOT the GitHub Actions schema/expression grammar, so an invalid `${{ }}` reached
  # main and put ai-review into startup_failure REPO-WIDE (a literal empty `${{ }}`
  # in a run: comment — YAML sees a string, Actions sees an invalid expression). This
  # is the gate that was missing. shellcheck/pyflakes are OFF: they lint the shell/
  # python INSIDE run: blocks (noisy style, out of scope) — we gate ONLY the
  # workflow-syntax/expression/schema class that broke the pipeline. Verified clean
  # across all current workflows with these flags; still catches the #486 class.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned script + pinned binary version (the exact release used to verify the
      # #486 fix) — deterministic, no floating `latest`/`main`.
      - name: Install actionlint (pinned)
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Lint GitHub Actions workflows
        run: ./actionlint -shellcheck= -pyflakes= -color

  test:
    needs: paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # @aiclarity/shared is consumed by extension source (e.g. bridge.ts). The v8
      # coverage provider resolves that cross-package import to the package's built
      # `out/` entry when instrumenting — the test-only vitest `resolve.alias`
      # (which redirects to source) does not cover the coverage provider's own
      # resolution, so without a build the run fails with "Cannot find module
      # @aiclarity/shared/out/index.js". Build the Tier-0 lib first (pure tsc).
      - name: Build shared lib (coverage resolution)
        run: npm run build --workspace=@aiclarity/shared

      # @vitest/coverage-v8 is a devDependency pinned to the vitest version in
      # package.json (^4.1.7); `npm ci` installs the matching provider. A prior
      # step force-installed coverage-v8@2.1.9 with --legacy-peer-deps on top of
      # vitest@4 — that incompatible provider reaches into vitest internals that
      # moved in v4, throwing `Cannot read properties of undefined (reading
      # 'fetchCache')` during the coverage run (#158). Keep the provider version
      # sourced solely from package.json so a vitest bump can't desync it again.
      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text

      - name: Generate badge JSON
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const summary = require('./coverage/coverage-summary.json');
            const cov = Math.round(summary.total.statements.pct * 10) / 10;
            const covColor = cov >= 90 ? 'brightgreen' : cov >= 80 ? 'green' : cov >= 70 ? 'yellow' : 'red';
            fs.mkdirSync('.badges', { recursive: true });
            fs.writeFileSync('.badges/coverage.json', JSON.stringify({
              schemaVersion: 1, label: 'coverage', message: cov + '%', color: covColor
            }));
          "

      - name: Extract test counts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TEST_OUTPUT=$(npx vitest run 2>&1 || true)
          PASSED=$(echo "$TEST_OUTPUT" | grep -oP '\d+(?= passed)' | tail -1)
          TOTAL=$(echo "$TEST_OUTPUT" | grep -oP '(?<=\()\d+(?=\))' | tail -1)
          if [ "$PASSED" = "$TOTAL" ]; then COLOR="brightgreen"; else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passed\",\"color\":\"${COLOR}\"}" > .badges/tests.json

      - name: Publish badges to badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: badges
          folder: .badges
          clean: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, paths]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build MinSpec
        if: needs.paths.outputs.docs_only != 'true'
        working-directory: packages/minspec
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build extension
        working-directory: packages/minspec
        run: npm run build

      - name: Compile e2e tests
        working-directory: packages/minspec
        run: tsc -p tsconfig.test.json

      # Clean-tree precondition for the e2e run (#900). The e2e suite drives real
      # commands against the checkout, and several of them read `git diff` — most
      # notably `minspec.classify`, which returns silently on a clean tree but
      # renders an interactive, button-bearing notification on a dirty one. That
      # precondition was previously UNDECLARED and unasserted, so when `npm ci`
      # clobbered a tracked path the only symptom was an opaque 30s mocha timeout
      # inside a screenshot test, ~4 minutes into the job.
      #
      # This is the gate that was missing: assert it here, in one line, naming the
      # offending path — BEFORE the e2e run rather than 30s into it. The e2e
      # teardown was hardened independently (src/test/screenshots.test.ts) so a
      # dirty tree can no longer hang the suite; this step keeps the dirtiness
      # itself from passing silently.
      - name: Assert checkout is clean after install + build
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::Working tree is dirty after npm ci + build — a tracked path is being clobbered or a build artifact is unignored:"
            printf '%s\n' "$dirty"
            exit 1
          fi

      - name: Run e2e tests
        working-directory: packages/minspec
        run: xvfb-run -a npm run test:e2e

  security:
    name: Supply-chain scan (bumblebee)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      # Pinned scanner binary: a main SHA reading exposure-catalog schema 0.2.0.
      # No released tag reads 0.2.0 (v0.1.2, the latest, reads only 0.1.0); a
      # checksum-pinned SHA is immutable + GOSUMDB-verified and satisfies #850's
      # "never floating" intent. The Fetch step inherits this, so CI catalogs pin
      # to the SAME ref — a reproducible per-PR gate. See DR-005 / #866.
      BUMBLEBEE_VERSION: 4a02b80aaca86641767c0d6cbe77c6856e4b481b
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - run: npm ci

      - name: Install bumblebee
        run: go install "github.com/perplexityai/bumblebee/cmd/bumblebee@${BUMBLEBEE_VERSION}"

      - name: Fetch threat catalogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-bumblebee-catalogs.sh ./.bumblebee-catalogs

      - name: Run supply-chain scan
        env:
          BUMBLEBEE_BIN: ${{ runner.tool_cache }}/go/bin/bumblebee
          BUMBLEBEE_CATALOGS: ${{ github.workspace }}/.bumblebee-catalogs
        run: |
          # Use Go's GOBIN default ($HOME/go/bin) since setup-go does not set tool_cache path.
          export BUMBLEBEE_BIN="$HOME/go/bin/bumblebee"
          ./scripts/check-supply-chain.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-inventory
          path: .cache/supply-chain/*.ndjson
          if-no-files-found: warn
          retention-days: 30

  package:
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build MinSpec
        working-directory: packages/minspec
        run: npm run build

      - name: Package MinSpec
        working-directory: packages/minspec
        run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: minspec-vsix
          path: packages/minspec/*.vsix
          if-no-files-found: error
