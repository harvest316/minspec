# secret-scan — independent CI witness for the client-side gitleaks gate (#1620)
#
# `.githooks/pre-commit` runs `gitleaks protect --staged` as the secret gate (#1583,
# #1610), and it is DELIBERATELY optional: a developer without the `gitleaks` binary
# installed gets a printed warning and the commit proceeds, because a missing optional
# local tool must never wedge a commit. The consequence, per constitution invariant 2
# (DR-066), is that the hook is a SINGLE producer that one machine's missing binary
# silently disables — no CI workflow scanned for secrets at all (verified while filing
# #1583/#1620: no `.github/workflows/*` mentioned gitleaks/trufflehog/any scanner).
#
# This workflow is the independent second witness. It runs in CI, not on a developer's
# machine, so no local config gap — missing binary, skipped install, `SECRET_GATE_OFF`
# — can silence it. That is the entire point, so it is built to the OPPOSITE contract
# of the hook:
#
# ── FAIL CLOSED, ALWAYS ───────────────────────────────────────────────────────────
#   • No `command -v gitleaks || warn`-and-continue shape. If gitleaks cannot be
#     installed, or the scan cannot run, the job FAILS. A broken CI runner is nobody's
#     half-finished commit to protect, unlike the hook's audience.
#   • No `|| true`, no `continue-on-error`, no swallowed exit code anywhere below.
#   • `SECRET_GATE_OFF` is NEVER read here. That variable is a deliberate CLIENT-SIDE
#     escape hatch (rare, local, human-typed at commit time); a server-side witness
#     that honoured it would be disable-able by the exact same config gap it exists to
#     catch, which defeats the whole reason for a second witness.
#
# ── FULL COMMIT RANGE, NOT JUST HEAD ──────────────────────────────────────────────
#   Uses `gitleaks git` (the non-deprecated form — #1621 tracks retiring `gitleaks
#   protect` from the hook; this workflow does not add a third copy of the deprecated
#   invocation) with an explicit `--log-opts` revision range covering every commit the
#   PR (or push) adds — `pull_request.base.sha..pull_request.head.sha`, or
#   `before..after` for a direct push. A secret added in one commit and removed in a
#   later commit on the same branch is still IN HISTORY and still caught: verified
#   locally (see PR description) that `gitleaks git --log-opts="$BASE..$HEAD"` flags a
#   secret introduced two commits back even though the file no longer exists at HEAD.
#
# ── ONE SHARED ALLOWLIST ──────────────────────────────────────────────────────────
#   No `--gitleaks-ignore-path` override — gitleaks' own default lookup (current
#   directory) finds the SAME `.gitleaksignore` the hook reads, so a finding triaged
#   and suppressed locally is suppressed here too. #1663 notes that file's fingerprints
#   are line-pinned against a generated file and asks for a path/rule-based
#   `.gitleaks.toml` allowlist instead; that migration is tracked there, not
#   duplicated here — this job just reads whatever the single allowlist file says,
#   same as the hook.
#
# ── ACTIONABLE ON A FINDING (#1538) ───────────────────────────────────────────────
#   `-v --redact`: the rule id, file and line are printed so the failure can be acted
#   on; the secret VALUE never is.
#
# ── NOT a required status check yet ───────────────────────────────────────────────
#   Adding a job here makes the signal exist; making it BLOCK a merge is a separate,
#   repository-settings act (Settings → Rules → main → require this check) that a
#   workflow file cannot perform on itself, and the App installation token that runs
#   as this repo's bot identity cannot write org/repo rulesets either. Until a human
#   adds `gitleaks` to the branch ruleset's required checks, this job is a visible,
#   always-on witness but not yet a gate — see the PR for #1620 for the explicit
#   manual step.
name: Secret scan (gitleaks)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Determine commit range (fail closed on an unpinned range)
        id: range
        # Every value below is a GitHub-assigned commit SHA or the literal event
        # name — never PR/issue free text (title, body, branch name) — so this is
        # the same "trusted, non-interpolated-into-a-string" class ready-to-merge.yml
        # documents for its own base-sha read. Routed through `env:` rather than
        # interpolated into the script body, matching that precedent, so no event
        # field is ever substituted directly into a shell command.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::pull_request event carried no base/head sha — refusing to scan an unpinned range." >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_AFTER_SHA"
            if [ -z "$head_sha" ] || [ "$head_sha" = "$zero_sha" ]; then
              echo "::error::push event carried no resolvable head sha — refusing to scan an unpinned range." >&2
              exit 1
            fi
            if [ -z "$base_sha" ] || [ "$base_sha" = "$zero_sha" ]; then
              # First-ever push of the branch: no prior state to diff from. Scan the
              # full history reachable from head rather than guessing a range —
              # still fail-closed (a real scan runs), just wider than usual.
              base_sha=""
            fi
          else
            echo "::error::Unhandled event '$EVENT_NAME' — refusing to scan an unpinned range." >&2
            exit 1
          fi

          if [ -n "$base_sha" ]; then
            log_opts="${base_sha}..${head_sha}"
          else
            log_opts="${head_sha}"
          fi
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"
          echo "Scanning commit range: ${log_opts}"

      - name: Install gitleaks (pinned, checksum-verified — fail closed)
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/$asset" "$url"
          echo "${sha256}  $tmp/$asset" | sha256sum -c -
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          installed_version="$(gitleaks version)"
          if [ "$installed_version" != "$version" ]; then
            echo "::error::Installed gitleaks reports version '$installed_version', expected '$version'." >&2
            exit 1
          fi

      - name: Run gitleaks over the full PR range (fail closed — never honours SECRET_GATE_OFF)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          gitleaks git . \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            -v \
            --exit-code=1
