# ai-review — independent AI reviewer in CI, posting AS THE APP (#342 Track B, #428)
#
# Runs the credential-free independent reviewer over a PR's diff and posts the
# verdict + applies the `ai-review:pass` / `ai-review:changes` label AS THE
# `minspec-sdd[bot]` GitHub App — giving the label bot-PROVENANCE, the root that
# makes auto-merge-on-`ai-review:pass` safe (#428). This is the "dedicated
# reviewer identity" the ready-to-merge.yml header calls out as the missing piece:
# until now the label was applied by a human account, so its provenance could only
# be enforced at account granularity. Applied by the App from THIS run only (no
# human in the loop), it becomes a real provenance root.
#
# ── REUSED, NOT REWRITTEN (on main) ──────────────────────────────────────────
#   • scripts/review-branch.sh <base> <head> [--role reviewer|security]
#       Runs `claude -p --allowedTools "Read,Glob,Grep" --model opus` over
#       `git diff base...head` framed as <untrusted_diff>; prints the raw agent
#       output (a REVIEW_VERDICT_BEGIN…END block) to stdout. The agent holds NO
#       gh/git/network/Bash — it can only return TEXT. Empty diff / agent crash →
#       no verdict (the gate then fails closed).
#   • scripts/review-decide.sh  (stdin→stdout, pure, fail-closed)
#       Emits exactly one label: `ai-review:pass` or `ai-review:changes`. Missing/
#       garbled/>1-block/non-"pass"/ESCALATE → `ai-review:changes` (never a false
#       green).
#
# ── SECURITY MODEL (T0 invariants) ───────────────────────────────────────────
#   • TRUSTED CONTROL PLANE FROM BASE (the load-bearing one). We check out the
#     PR's BASE ref, so every executed reviewer SCRIPT — scripts/review-branch.sh,
#     scripts/review-decide.sh, scripts/roles/* — is the BASE (trusted) version.
#     A same-repo PR author (write access → secrets present) therefore cannot
#     rewrite review-decide.sh to `echo ai-review:pass` and forge a pass THAT WAY.
#     SCOPE (no overclaim): this base-trust covers the reviewer SCRIPTS/ROLES, NOT
#     this workflow file — `on: pull_request` still runs ai-review.yml from the PR
#     HEAD, and a PR could edit the gate itself (this .yml, or a scripts/* file it
#     will run in a later base run) to forge a pass. That residual is closed by the
#     SELF-EDIT GUARD below, NOT by the base checkout. The untrusted head is fetched
#     for the `git diff base...head` ONLY — its file CONTENTS are seen solely as
#     diff DATA, never checked out into the workspace and never executed.
#   • SELF-EDIT GUARD (fail closed on MERGE, #596-disambiguated). Because
#     ai-review.yml runs from head, the reviewer cannot self-CERTIFY (auto-merge) a
#     PR that rewrites the reviewer. The guard now keeps two orthogonal states
#     DISTINCT, so a machinery PR's honest code verdict is never conflated with a
#     reviewer-requested change (#596 — the conflation hid the real #900 blocker):
#       – MACHINERY (changed set touches `.github/` OR `scripts/`): the panel's
#         honest verdict is KEPT as the `ai-review:*` label — a clean machinery PR
#         reads `ai-review:pass`, a genuinely-flagged one reads `ai-review:changes`,
#         each surfacing distinctly. Auto-MERGE is instead held by a SEPARATE,
#         clearly-named human gate: the `needs-human-review` label, the
#         `machinery-review-required` check (`action_required`), and `ready-to-merge`
#         staying red because NO SHA-bound pass witness is posted for a machinery PR
#         (its `ai-review` check-run is `neutral` and its `ai-review/pass` commit
#         status is `failure`).
#       – INDETERMINATE (changed set cannot be computed at all): the verdict is
#         FORCED to `ai-review:changes` — we cannot prove the PR is clean, so fail
#         closed; an errored/empty changed-file computation is treated AS a self-edit.
#     Auto-MERGE is therefore impossible on a self-editing PR in both sub-cases.
#   • `pull_request` (NOT `pull_request_target`): the latter would run untrusted
#     PR code WITH secrets — a well-known exfil hole. Our PRs are same-repo
#     branches, so secrets are available under plain `pull_request`. A FORK PR
#     gets EMPTY secrets → the guard step below skips cleanly (no red, no leak).
#   • Credential separation. The review agent (`claude -p` inside
#     review-branch.sh) authenticates for INFERENCE via CLAUDE_CODE_OAUTH_TOKEN,
#     but runs with `--allowedTools "Read,Glob,Grep"` so it has NO tool that can
#     use a credential (no gh, git, network, or Bash). The GitHub App token lives
#     ONLY in the stale-clear / post / fail-closed steps (the credentialed parent)
#     and is NEVER present in the review step — so the agent cannot post, label, or
#     merge. The untrusted diff stays DATA (review-branch.sh does the framing);
#     this workflow never interpolates PR title/body/diff into a shell (only
#     base/head SHAs and the PR number, passed via env).
#   • Output redaction (token exfil). The review step carries
#     CLAUDE_CODE_OAUTH_TOKEN for inference; a prompt-injected diff could coax the
#     no-tools reviewer to echo `/proc/self/environ`. Before the verdict text ever
#     reaches the PR comment we scrub the token value AND any `sk-ant-*` secret to
#     `***`, so a leaked token can never land in the bot-posted comment. (The App
#     token is not in this step at all.)
#   • Supply chain. The Claude CLI is pinned to an exact published version and
#     every marketplace action to a full commit SHA — a backdoored `latest`/`@vN`
#     cannot run with the token in env.
#   • TOCTOU. `cancel-in-progress` can leave a superseded `ai-review:pass` (from an
#     earlier commit) on the PR while this run re-reviews the new head. At run
#     start we clear any stale pass and mark the PR `ai-review:pending`, so it
#     cannot feed auto-merge mid-run. The COMPLETE fix — ready-to-merge verifying
#     the pass was applied to the CURRENT head SHA — is a follow-up in
#     ready-to-merge.yml (deliberately NOT edited from here).
#   • Fail closed everywhere: any error, missing verdict, or a security-role (any
#     code change) that requests changes → `ai-review:changes`. A spurious auto-MERGE
#     is the worst outcome (never a spurious label), so a machinery PR
#     (`.github/`/`scripts/`) can NEVER auto-merge — but its `ai-review:*` LABEL now
#     reflects the panel's honest code verdict (#596); the merge hold is the separate
#     `machinery-review-required` / `needs-human-review` human gate plus a red
#     `ready-to-merge`, NOT a masked `ai-review:changes`. An indeterminate
#     changed-file set still fails closed to `ai-review:changes`.
#   • RESIDUALS (known, LOW; tracked with #458). (a) redact() scrubs the literal
#     token value and `sk-ant-*`; an agent that re-encodes the token before echoing
#     it (base64/hex/split) could slip past the literal scrub — but the no-tools
#     agent cannot read the token in the first place, so this is defence-in-depth,
#     not the primary control. (b) The stale-pass clear at run start is best-effort
#     (`|| true`); the post step writes the authoritative label, and the COMPLETE
#     TOCTOU fix (ready-to-merge verifying the pass SHA == head) is a follow-up in
#     ready-to-merge.yml.
#
# ── ACTIVATION (deps flagged in the PR body) ─────────────────────────────────
#   1. Add the `CLAUDE_CODE_OAUTH_TOKEN` repo secret (`claude setup-token`) — a
#      genuine-CLI subscription OAuth token, per DR-052 (NOT the Agent SDK, NOT a
#      broker). Until it exists, this workflow SKIPS with a notice (never reds).
#   2. Confirm `MINSPEC_APP_PRIVATE_KEY` is the RAW PEM (create-github-app-token
#      needs raw, not base64), and the App is installed on the repo with
#      `pull-requests: write` + `issues: write` (labels/comments use the issues
#      API) + `checks: write` (the honest `ai-review` verdict check-run) +
#      `statuses: write` (#466 — the SHA-bound `ai-review/pass` commit status the
#      bot posts on the reviewed head SHA; ready-to-merge REQUIRES it on the current
#      head, so the pass is bound to the exact commit reviewed).
#      HEAD-WITNESS REDUNDANCY (#810): ready-to-merge accepts EITHER the
#      `ai-review/pass` commit status (needs `statuses: write`) OR the `ai-review`
#      verdict check-run (needs `checks: write`) on the current head — both are
#      SHA-bound and both are provenance-checked against `AI_REVIEW_BOT_LOGINS`, so
#      either alone is a full-strength witness. Losing ONE permission therefore
#      degrades gracefully (a loud Actions warning) instead of making the required
#      gate unsatisfiable repo-wide — the #810 failure, where every merge became an
#      `--admin` bypass. If BOTH are absent no witness exists and ready-to-merge
#      stays RED (fail-closed) until the App is granted one — deny-by-default,
#      never a false green (same posture as an unset `AI_REVIEW_BOT_LOGINS`).
#   3. AFTER a verified run: set repo variable `AI_REVIEW_BOT_LOGINS =
#      minspec-sdd[bot]` (so ready-to-merge.yml trusts ONLY the bot) and add the
#      `ai-review` verdict check as a REQUIRED check in the branch ruleset
#      (#480 — 3-way conclusion makes this safe to leave always-on: machinery
#      PRs self-exempt via `neutral`, a genuine pass is `success`, and anything
#      else is `failure` and actually blocks — the runner's own
#      `ai-review-runner` job is not the signal). Deliberately NOT done here
#      (ruleset config is a human/HITL action, not this workflow's).

# NOTE — why this workflow is `ai-review-runner`, not `ai-review`:
# GitHub Actions posts one implicit check-run per JOB, named after the job, whose
# conclusion is just "did the job exit 0". If the job were named `ai-review`, that
# implicit check would go GREEN whenever the reviewer merely RAN — even when the
# verdict is `ai-review:changes` — so a human reading `ai-review: success` would
# wrongly think the PR passed. So the runner job is named `ai-review-runner` (its
# implicit check honestly means "the review ran"), and the name `ai-review` is
# reserved for the EXPLICIT verdict check-run posted at the end of the job, whose
# conclusion MIRRORS THE VERDICT — 3-way as of #480: a machinery PR (touches
# `.github/`/`scripts/`) → `neutral` (self-exempt, a gate can't certify itself),
# `ai-review:pass` → `success`, anything else → `failure`. Green on `ai-review`
# therefore means the PR actually passed, never just "it ran"; `failure` is what
# lets this be a real, always-on REQUIRED merge gate.
name: ai-review-runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege for the workflow's OWN token: it only needs to read code to
# check out. All PR posting/labelling uses the App token (steps.app-token), never
# this GITHUB_TOKEN — that is what gives the label its bot provenance.
permissions:
  contents: read

# One review in flight per PR; a new push supersedes the previous run.
concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Renamed from `ai-review` → `runner` so its implicit "did the job exit 0"
  # check-run is NOT called `ai-review` (see the NOTE at the top of this file).
  # The authoritative `ai-review` check is posted explicitly by the final step,
  # with a conclusion that mirrors the verdict.
  runner:
    runs-on: ubuntu-latest
    steps:
      # Secrets can't be read inside `if:`, so copy them into a step env and set an
      # output. Empty (unset secret, or a fork PR) → skip the rest with a NOTICE,
      # never a failure. Keeps this workflow safe to merge before the credentials
      # exist and safe against fork PRs.
      - name: Check reviewer is configured (skip cleanly if not)
        id: guard
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APP_ID: ${{ secrets.MINSPEC_APP_ID }}
          APP_KEY: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${OAUTH_TOKEN}" ] || [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::notice title=AI reviewer not configured::Add the CLAUDE_CODE_OAUTH_TOKEN and MINSPEC_APP_ID / MINSPEC_APP_PRIVATE_KEY repo secrets to activate the independent AI reviewer. Skipping — this is NOT a failure."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Mint the App installation token → the actor for every post/label below is
      # `minspec-sdd[bot]`. Needs the RAW PEM in MINSPEC_APP_PRIVATE_KEY.
      - name: Mint GitHub App token (post as minspec-sdd[bot])
        id: app-token
        if: steps.guard.outputs.configured == 'true'
        uses: actions/create-github-app-token@f2acddfb5195534d487896a656232b016a682f3c # v1.9.0
        with:
          app-id: ${{ secrets.MINSPEC_APP_ID }}
          private-key: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}

      # TOCTOU guard (partial). `cancel-in-progress` means a superseded
      # `ai-review:pass` from an earlier commit can linger while this run re-reviews
      # the NEW head — long enough for auto-merge to fire on unreviewed code. Clear
      # any stale pass and mark the PR `ai-review:pending` for the duration of this
      # run, AS THE BOT (App token). Best-effort (`|| true`): removing the stale
      # pass is load-bearing, but a transient label-API hiccup here must not red the
      # run — the final post step below writes the authoritative label anyway. The
      # COMPLETE fix (ready-to-merge verifying the pass label's commit SHA == head)
      # is a follow-up in ready-to-merge.yml, NOT edited here.
      - name: Clear stale pass at run start (mark pending) as minspec-sdd[bot]
        if: steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Self-heal ALL label objects this workflow can apply, on a fresh repo
          # that has never run it before (`gh pr edit --add-label` 404s if the
          # label object doesn't exist yet — a repo's labels aren't git content,
          # so copying this workflow into a new repo does NOT bring them along).
          # `ai-review:blocked` was already created defensively further down (only
          # on the blocked path); `pending`/`pass`/`changes` were NOT, so a fresh
          # repo's "Post verdict" step 404s on its load-bearing add-label call —
          # found porting this workflow into scroogellm (2026-07-09). Create all
          # four here, earliest point in the job, so nothing downstream can hit it.
          gh label create "ai-review:pending" --repo "$REPO" --color fbca04 \
            --description "AI review in progress" 2>/dev/null || true
          gh label create "ai-review:pass" --repo "$REPO" --color 0e8a16 \
            --description "Independent AI reviewer greenlit (advisory; human still approves)" 2>/dev/null || true
          gh label create "ai-review:changes" --repo "$REPO" --color d93f0b \
            --description "AI reviewer requested changes — loops back to dev" 2>/dev/null || true
          gh label create "ai-review:blocked" --repo "$REPO" --color d4c5f9 \
            --description "AI review could not run (quota/transient) — retry-able, not a code verdict" 2>/dev/null || true

          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "ai-review:pass" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "ai-review:pending" 2>/dev/null || true

      # Check out the TRUSTED BASE ref (NOT the PR head). This makes the executed
      # control plane — scripts/review-branch.sh, scripts/review-decide.sh,
      # scripts/roles/* — the BASE versions, so a same-repo PR cannot rewrite the
      # gate to forge a pass. fetch-depth: 0 gives full history (so the merge-base
      # for `base...head` is present); the untrusted head is fetched in the review
      # step for the DIFF ONLY (data), never checked out or executed.
      - name: Checkout TRUSTED base (control scripts come from base, never head)
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node 22
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Genuine Claude Code CLI so `claude -p` (inside review-branch.sh) is on PATH.
      # DR-052: the real CLI direct to Anthropic — NOT the Agent SDK, NOT a broker.
      # Pinned to an exact published version (supply-chain): a backdoored `latest`
      # must not run in the step that holds the inference token.
      - name: Install Claude Code CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.201

      # Reviewer (always) + security (any non-docs code change). Each role's
      # output is decided by the fail-closed gate; the combined verdict passes ONLY
      # if every required role passed. CLAUDE_CODE_OAUTH_TOKEN is the INFERENCE
      # credential for `claude -p` here — the agent still has no actionable tool.
      # The App token is intentionally ABSENT from this step.
      #
      # ANTHROPIC_API_KEY / AI_REVIEW_FAILOVER are the quota-failover pair that
      # review-branch.sh reads (`AI_REVIEW_FAILOVER == payg && -n ANTHROPIC_API_KEY`).
      # Both are the SAME KIND of credential as the OAuth token above — inference
      # only, no actionable tool — so this does not widen the step's authority. They
      # are passed together deliberately: the script's condition needs both, so
      # setting the repo variable without forwarding the secret (or the reverse)
      # leaves the failover configured-looking but inert, which is the failure this
      # wiring exists to prevent. With neither set, the expressions render empty and
      # the default `wait` behaviour is unchanged.
      - name: Independent review → decide combined label
        id: review
        if: steps.guard.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_FAILOVER: ${{ vars.AI_REVIEW_FAILOVER }}
          AI_REVIEW_COVERAGE: ${{ vars.AI_REVIEW_COVERAGE }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          BASE="$PR_BASE_SHA"
          HEAD="$PR_HEAD_SHA"

          # ── review coverage (repo-level; CI has no per-dev machine — the per-dev
          #    slider in #453 is the LOCAL review-pr.sh path). 'single' = reviewer
          #    only (legacy); 'panel' = + architect + skeptic voters (security stays
          #    code-only). Default 'panel'; set repo variable AI_REVIEW_COVERAGE=single
          #    to dial back to one voter. Unknown value → panel (fail toward coverage).
          COVERAGE="${AI_REVIEW_COVERAGE:-panel}"
          case "$COVERAGE" in single|panel) ;; *) COVERAGE=panel ;; esac

          # The workspace is the TRUSTED base checkout (fetch-depth: 0). Fetch the
          # UNTRUSTED head SHA so `git diff base...head` has both endpoints — the
          # head is brought in as DIFF DATA ONLY; it is never checked out and no
          # script from it is executed. The SHA is passed via env (never raw
          # interpolation). If the fetch fails, the diff is empty → fail closed.
          git fetch --no-tags --quiet origin "$HEAD" 2>/dev/null || true

          # Marker = the token ALONE ON A LINE, the SAME predicate review-decide.sh
          # uses to decide the label (#1157). Display and decision must agree: when
          # this extractor matched a marker the decider did not (or vice versa), the
          # rendered block could read `verdict: pass` under an `ai-review:changes`
          # label, and nothing detected the contradiction. Measured on #1209.
          extract_block() {
            sed -n '/^[[:space:]]*REVIEW_VERDICT_BEGIN[[:space:]]*$/,/^[[:space:]]*REVIEW_VERDICT_END[[:space:]]*$/p'
          }

          # Scrub any inference-token value or `sk-ant-*` secret to `***` before the
          # reviewer text can reach the PR comment. Defeats a prompt-injected diff
          # that coaxes the no-tools reviewer into echoing /proc/self/environ.
          # awk index() does a LITERAL (regex-free) match of the exact token value,
          # so it is robust regardless of characters in the token.
          redact() {
            sed -E 's/sk-ant-[A-Za-z0-9_-]+/***/g' \
              | if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
                  awk -v tok="$CLAUDE_CODE_OAUTH_TOKEN" \
                    '{ while ((p=index($0,tok))>0) $0=substr($0,1,p-1) "***" substr($0,p+length(tok)); print }'
                else
                  cat
                fi \
              | if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                  # The sed above already catches today's `sk-ant-*` shape. This pass
                  # does not trust that shape: it matches the key's LITERAL value, so
                  # a future key format stays redacted without anyone remembering to
                  # update a regex. Same treatment the OAuth token gets, same reason.
                  awk -v tok="$ANTHROPIC_API_KEY" \
                    '{ while ((p=index($0,tok))>0) $0=substr($0,1,p-1) "***" substr($0,p+length(tok)); print }'
                else
                  cat
                fi
          }

          # ── self-edit fail-closed: does this PR touch the review machinery? ──
          # `on: pull_request` runs THIS workflow (and would run any scripts/* it
          # calls in a later BASE run) from a head the PR author controls. The base
          # checkout makes the reviewer SCRIPTS trusted, but NOT edits to them, so a
          # PR that rewrites `.github/` or `scripts/` could forge a pass. We compute
          # the changed-file set ONCE here (reused by the security role below) with
          # EXPLICIT error detection: if `git diff` fails OR the set is empty we
          # cannot prove the PR is clean, so we FAIL CLOSED and treat it as a
          # self-edit — never as clean. Any match of `^\.github/` or `^scripts/`
          # forces the final verdict to changes (an OVERRIDE applied at combine
          # time, not a skip — the reviewer still runs below, for information).
          CHANGED=""
          CHANGED_OK=no
          if CHANGED="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)" && [ -n "$CHANGED" ]; then
            CHANGED_OK=yes
          fi

          SELF_EDIT=no
          SELF_EDIT_KIND=""
          if [ "$CHANGED_OK" != "yes" ]; then
            SELF_EDIT=yes
            SELF_EDIT_KIND=indeterminate
          # MACHINERY_PATHS_RE — the machinery path set (#1284, reconciled #1758). Gate-ness
          # is a property of what the code DOES, not which directory it lives in: every entry
          # here is code that decides whether some other change is allowed, so it cannot
          # certify itself.
          #   .github/   — the review workflows and their scripts
          #   scripts/   — dispatch, review, remediation, the lease
          #   .githooks/ — pre-commit (protected-branch #1041, RCDD DR-003), pre-push
          #                (workflow-file protection #1120), commit-msg. Added #1284 after
          #                PR #1273 changed the pre-push GATE and was classified "not
          #                machinery", so the review system certified a change to a gate.
          #   .circleci/, .buildkite/, .husky/ — unused by this repo today, but
          #                scripts/auto-merge-gate.ts's CI/build boundary detector (#422)
          #                already treats them as machinery-class; folded in here so all
          #                three consumers agree instead of silently disagreeing (#1758).
          #   template-registry.ts — GENERATES the .minspec/hooks/pre-commit gate that every
          #                MinSpec-initialised project runs. Its blast radius is strictly
          #                larger than .githooks/ (which is this repo only), so leaving it
          #                out would have kept the bigger hole open. A single file rather
          #                than a directory is deliberate: membership is decided by the test
          #                below, not by where the code happens to live.
          #   ci-review-templates.ts — holds the VERBATIM ai-review workflow, review-decide.sh
          #                and ai-review-guard.js shipped to every consuming repo. By the
          #                membership test it is machinery with the LARGEST blast radius of
          #                anything here: a PR touching only this file changes the review gate
          #                for every downstream project. It was omitted in the first pass of
          #                #1284 — the same inconsistency the PR set out to fix — and added
          #                after the architect voter caught it.
          # MEMBERSHIP TEST for anything added here: does this code decide whether some other
          # change is allowed — directly, or by generating the thing that decides? If yes it
          # cannot certify itself, and it belongs in this set.
          # CANONICAL SOURCE: packages/minspec/src/lib/machinery-paths.ts. This line and
          # scripts/dispatch-issue.sh's MACHINERY_PATH_RE are both hand-copies of that
          # module's buildMachineryRegexSource() output — a shell string embedded in YAML
          # cannot import a TS module — pinned character-for-character by
          # packages/minspec/tests/machinery-paths.test.ts, which parses this line and runs
          # the pattern against a path table shared with the other two definitions (#1758:
          # a prior reconciliation, 01369b6b, updated only this file and a test that only
          # read this file, leaving dispatch-issue.sh's copy narrower and its invariant-2
          # second-witness inert for two paths). Keep the marker comment above it.
          elif printf '%s\n' "$CHANGED" | grep -qE '^\.github/|^scripts/|^\.githooks/|^\.circleci/|^\.buildkite/|^\.husky/|^packages/minspec/src/lib/(template-registry|ci-review-templates)\.ts$'; then
            SELF_EDIT=yes
            SELF_EDIT_KIND=machinery
          fi

          # ── which voters are REQUIRED (decided before any of them runs) ──
          # Separating "who runs" from "run them" is what lets the panel run CONCURRENTLY
          # below. The predicates themselves are unchanged.
          #
          # reviewer — always.
          #
          # security — runs on ANY code change; skipped only for docs-only PRs.
          # Agnostic — NO hardcoded monorepo path. Security flaws live in any executable
          # surface (sites/*.js, scripts/, .github/, config, packages/, …), not just
          # `packages/`, and the security lens has the SAME scope as the reviewer over
          # code. A PR is security-exempt ONLY when every changed file is Markdown (pure
          # docs/approvables). Durable per-project code-surface detection (init scans the
          # file list, dev confirms) is #453 / SPEC-033 D-4; this is the agnostic interim.
          SECURITY_REQUIRED=no
          if [ "$CHANGED_OK" = "yes" ] && printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
            SECURITY_REQUIRED=yes
          fi
          # architect (panel only) — design-fit / scope / contracts / missing-DR lens.
          # Always-on in panel: design review applies to specs AND code, so it is NOT
          # gated on the code-vs-docs split the security role uses.
          # skeptic (panel only) — evidence discipline: unproven done/fixed/implemented
          # claims, false status fields, hollow tests.
          ARCHITECT_REQUIRED=no
          SKEPTIC_REQUIRED=no
          if [ "$COVERAGE" = "panel" ]; then
            ARCHITECT_REQUIRED=yes
            SKEPTIC_REQUIRED=yes
          fi

          # ── run every required voter CONCURRENTLY ──
          # These were sequential, so wall-clock was the SUM of four independent
          # `claude -p` calls — 10m07s for a 3-line docs diff on #1017, with each voter
          # idle while the others ran. The voters share no state and their verdicts are
          # combined only afterwards, so nothing ordered them; the cost was accidental.
          #
          # Deliberately NOT solved by dropping voters: fewer lenses is a weaker gate,
          # and every one of them has caught a real defect this week. Concurrency buys
          # the latency back while keeping the panel whole.
          #
          # Each voter writes its own file (no interleaved stdout), and each is already
          # `|| true` so one failing voter cannot abort the others or the step.
          VOTE_DIR="$(mktemp -d)"
          # Voter stdout is the VERDICT (parsed); stderr is DIAGNOSTICS (quota vs
          # genuine-crash messages, the agent-output dump). They must not be merged
          # into one stream — stderr text in $1.out would be fed to review-decide.sh —
          # but stderr must not be discarded either: `2>/dev/null` silently deleted the
          # only evidence of WHY a voter failed, so a blocked verdict became
          # undiagnosable after the fact. Keep them separate and both visible: stdout
          # to the vote file, stderr to the Actions log, prefixed so parallel voters'
          # lines stay attributable when they interleave.
          run_voter() {  # $1 = role
            bash scripts/review-branch.sh "$BASE" "$HEAD" --role "$1" \
              > "$VOTE_DIR/$1.out" 2> "$VOTE_DIR/$1.err" || true
          }
          # `if` rather than `cond && { … }`: this step inherits `-e` from the Actions
          # default shell (`set -uo pipefail` does not clear it), and a false `&&` list
          # is only exempt from `-e` by a subtlety not worth resting a merge gate on.
          VOTER_PIDS=""
          # STAGGER the starts. Launching all four in the same instant made one voter
          # come back `blocked` on the very first parallel run (#1086: reviewer blocked
          # while security + architect + skeptic all passed — three simultaneous
          # successes rule out a token-quota outage and point at a burst limit).
          # A few seconds between starts costs almost nothing against a ~2.5min voter,
          # and the combine precedence is `changes > blocked > pass`, so ONE blocked
          # voter blocks the whole PR: a cheap desync is worth far more than the seconds.
          VOTER_STAGGER_SECS="${VOTER_STAGGER_SECS:-5}"
          run_voter reviewer & VOTER_PIDS="$VOTER_PIDS $!"
          if [ "$SECURITY_REQUIRED" = yes ]; then
            sleep "$VOTER_STAGGER_SECS"
            run_voter security & VOTER_PIDS="$VOTER_PIDS $!"
          fi
          if [ "$ARCHITECT_REQUIRED" = yes ]; then
            sleep "$VOTER_STAGGER_SECS"
            run_voter architect & VOTER_PIDS="$VOTER_PIDS $!"
          fi
          if [ "$SKEPTIC_REQUIRED" = yes ]; then
            sleep "$VOTER_STAGGER_SECS"
            run_voter skeptic & VOTER_PIDS="$VOTER_PIDS $!"
          fi
          # Wait for ALL of them. A voter that dies still leaves an (empty) file, which
          # the fail-closed reads below turn into `changes` — never a silent pass.
          for p in $VOTER_PIDS; do wait "$p" || true; done

          # Replay each voter's diagnostics AFTER the barrier, attributed and grouped.
          # Sequentially, review-branch.sh's stderr (quota-vs-genuine-crash messages,
          # the agent-output dump) landed in the Actions log by default. Running the
          # voters concurrently would interleave those streams unreadably, so they are
          # captured per voter and replayed here — visible and attributable, instead of
          # discarded. Losing them made a `blocked` verdict undiagnosable after the
          # fact: the classifier's reason could not be checked against what the CLI
          # actually said.
          for role in reviewer security architect skeptic; do
            if [ -s "$VOTE_DIR/$role.err" ]; then
              echo "::group::voter stderr — $role"
              cat "$VOTE_DIR/$role.err"
              echo "::endgroup::"
            fi
          done

          # ── collect verdicts (identical fail-closed handling to the sequential form) ──
          read_vote() { [ -f "$VOTE_DIR/$1.out" ] && cat "$VOTE_DIR/$1.out" || true; }

          REVIEWER_OUT="$(read_vote reviewer)"
          REVIEWER_LABEL="$(printf '%s\n' "$REVIEWER_OUT" | bash scripts/review-decide.sh || true)"
          REVIEWER_BLOCK="$(printf '%s\n' "$REVIEWER_OUT" | extract_block | redact)"
          [ -z "$REVIEWER_BLOCK" ] && REVIEWER_BLOCK="(reviewer emitted no verdict block — fail-closed to changes)"

          SECURITY_LABEL=""
          SECURITY_BLOCK=""
          if [ "$SECURITY_REQUIRED" = yes ]; then
            SECURITY_OUT="$(read_vote security)"
            SECURITY_LABEL="$(printf '%s\n' "$SECURITY_OUT" | bash scripts/review-decide.sh || true)"
            SECURITY_BLOCK="$(printf '%s\n' "$SECURITY_OUT" | extract_block | redact)"
            [ -z "$SECURITY_BLOCK" ] && SECURITY_BLOCK="(security reviewer emitted no verdict block — fail-closed to changes)"
          fi

          ARCHITECT_LABEL=""
          ARCHITECT_BLOCK=""
          if [ "$ARCHITECT_REQUIRED" = yes ]; then
            ARCHITECT_OUT="$(read_vote architect)"
            ARCHITECT_LABEL="$(printf '%s\n' "$ARCHITECT_OUT" | bash scripts/review-decide.sh || true)"
            ARCHITECT_BLOCK="$(printf '%s\n' "$ARCHITECT_OUT" | extract_block | redact)"
            [ -z "$ARCHITECT_BLOCK" ] && ARCHITECT_BLOCK="(architect emitted no verdict block — fail-closed to changes)"
          fi

          SKEPTIC_LABEL=""
          SKEPTIC_BLOCK=""
          if [ "$SKEPTIC_REQUIRED" = yes ]; then
            SKEPTIC_OUT="$(read_vote skeptic)"
            SKEPTIC_LABEL="$(printf '%s\n' "$SKEPTIC_OUT" | bash scripts/review-decide.sh || true)"
            SKEPTIC_BLOCK="$(printf '%s\n' "$SKEPTIC_OUT" | extract_block | redact)"
            [ -z "$SKEPTIC_BLOCK" ] && SKEPTIC_BLOCK="(skeptic emitted no verdict block — fail-closed to changes)"
          fi
          rm -rf "$VOTE_DIR"

          # ── combine (N-voter panel): pass ONLY if EVERY required voter passed.
          #    Precedence is changes > blocked > pass: a real `changes` from ANY voter
          #    that RAN wins (never masked by a sibling that was quota-`blocked`); a
          #    `blocked` (review could not RUN — quota/rate-limit/transient) surfaces
          #    only when nothing requested changes, i.e. the sole reason we cannot pass
          #    is an INCOMPLETE review → retry-able via `ai-review-retry`. `blocked` must
          #    never read as `changes` (that would tell the dev "the reviewer wants
          #    changes" and hide the real, fixable cause). reviewer is always required;
          #    security when code changed; architect + skeptic under `panel` coverage.
          #    Each REQUIRED voter contributes a "req:label" pair; unrequired voters
          #    (req=no) are skipped. An empty or unrecognised label is NOT an opinion
          #    about the code: the `*)` arm sets ANY_UNREPORTED, which joins ANY_BLOCKED
          #    in the second branch below → `ai-review:blocked`. Still fail closed (an
          #    unreported voter can never reach `pass`), but retry-able instead of a
          #    fabricated objection (#1234).
          #    Machinery PRs are NOT forced to changes: the self-edit override below
          #    fires only for SELF_EDIT_KIND=indeterminate (#596), so a machinery PR
          #    keeps whatever this block decided — `blocked` included — and its merge
          #    hold is carried separately by the `machinery-review-required` check and
          #    the absent SHA-bound pass witness, plus `needs-human-review` when the
          #    verdict is pass/changes. A `blocked` machinery PR does NOT get that
          #    label: shouldSummonHumanReview returns on `label === BLOCKED` BEFORE
          #    the isMachinery arm (ai-review-guard.js:889-890), leaving it to
          #    `ai-review-retry` first. ──
          FINAL="ai-review:pass"
          # #1234 — an ABSENT voter and a voter that OBJECTED are different events and
          # are no longer collapsed. Previously both fell to the `*)` arm and set
          # FINAL=changes, and ANY_BLOCKED was then discarded because it was promoted
          # only `if FINAL = pass`. Two consequences, both measured on #1675:
          #
          #   • one flaky voter outvoted three explicit passes, with ZERO findings
          #     anywhere, and the PR read `ai-review:changes` — "the reviewer read your
          #     code and wants changes", which nobody had said;
          #   • because the label was `changes` and not `blocked`, ai-review-retry never
          #     selected it, so the outage was terminal instead of retry-able. Three
          #     consecutive runs failed a DIFFERENT voter each time (2026-08-24).
          #
          # Precedence now: a real objection still wins (an outage must never HIDE a
          # finding), but an outage no longer manufactures one.
          # >>> verdict-combine (executed verbatim by ai-review-verdict-combine.test.ts)
          ANY_BLOCKED=no
          ANY_CHANGES=no
          ANY_UNREPORTED=no
          for pair in \
              "yes:${REVIEWER_LABEL}" \
              "${SECURITY_REQUIRED}:${SECURITY_LABEL}" \
              "${ARCHITECT_REQUIRED}:${ARCHITECT_LABEL}" \
              "${SKEPTIC_REQUIRED}:${SKEPTIC_LABEL}"; do
            req="${pair%%:*}"
            lbl="${pair#*:}"
            [ "$req" = "yes" ] || continue
            case "$lbl" in
              ai-review:pass)    ;;
              ai-review:blocked) ANY_BLOCKED=yes ;;
              ai-review:changes) ANY_CHANGES=yes ;;
              # Empty or unrecognised: the voter did not report. NOT an opinion about
              # the code — it is the same class as `blocked`, and fails closed the same
              # way (never `pass`), but stays retry-able.
              *)                 ANY_UNREPORTED=yes ;;
            esac
          done
          if [ "$ANY_CHANGES" = "yes" ]; then
            FINAL="ai-review:changes"
          elif [ "$ANY_BLOCKED" = "yes" ] || [ "$ANY_UNREPORTED" = "yes" ]; then
            FINAL="ai-review:blocked"
          fi
          # <<< verdict-combine

          # ── self-edit handling (fail closed on MERGE, #596-disambiguated) ──
          #    A PR touching the review machinery, or one whose changed set could not
          #    be determined, can NEVER auto-MERGE — but the two cases are kept
          #    DISTINCT so a machinery PR's honest code verdict is not conflated with a
          #    reviewer-requested change (#596 — a real `ai-review:changes` was
          #    indistinguishable from the guard, which hid the #900 blocker):
          #      • MACHINERY → KEEP the panel's verdict as the label (FINAL is left as
          #        the combine result: a clean machinery PR reads `ai-review:pass`, a
          #        genuinely-flagged one reads `ai-review:changes`). The MERGE hold is
          #        carried SEPARATELY (post step): the `needs-human-review` label, the
          #        `machinery-review-required` check, and `ready-to-merge` staying red
          #        because no SHA-bound pass witness is posted for a machinery PR.
          #      • INDETERMINATE → FORCE `ai-review:changes` (cannot prove clean).
          #    is_machinery (below) is the SAME predicate and still drives the
          #    `ai-review` check-run to `neutral` for machinery, so that check is never
          #    a pass witness and the required gate self-exempts exactly as before. ──
          if [ "$SELF_EDIT" = "yes" ] && [ "$SELF_EDIT_KIND" != "machinery" ]; then
            FINAL="ai-review:changes"
          fi

          echo "label=$FINAL" >> "$GITHUB_OUTPUT"

          # ── is_machinery output (#480) — reused by the check-run step below to
          #    self-exempt (neutral) an always-on REQUIRED `ai-review` check.
          #    ONLY the unambiguous "changed paths match .github/|scripts/" case
          #    counts, NOT the "indeterminate" (diff-computation-failed) case:
          #    that one must stay fail-closed (failure), or a PR could win the
          #    neutral exemption simply by making the changed-file diff error.
          IS_MACHINERY=false
          [ "$SELF_EDIT_KIND" = "machinery" ] && IS_MACHINERY=true
          echo "is_machinery=$IS_MACHINERY" >> "$GITHUB_OUTPUT"

          echo "Coverage=$COVERAGE | Reviewer=${REVIEWER_LABEL:-<none>} | Security(${SECURITY_REQUIRED})=${SECURITY_LABEL:-<n/a>} | Architect(${ARCHITECT_REQUIRED})=${ARCHITECT_LABEL:-<n/a>} | Skeptic(${SKEPTIC_REQUIRED})=${SKEPTIC_LABEL:-<n/a>} | SelfEdit=${SELF_EDIT}(${SELF_EDIT_KIND:-none}) | FINAL=$FINAL | IsMachinery=$IS_MACHINERY"

          # ── build the PR comment body (findings/rationale behind the label) ──
          BODY="$RUNNER_TEMP/ai-review-comment.md"
          {
            echo "## 🤖 AI review — \`$FINAL\`"
            echo
            if [ "$FINAL" = "ai-review:blocked" ]; then
              # The reviewer could not RUN — a transient/quota outage, NOT a verdict
              # on the code. Give the dev the plain-language cause + concrete options
              # so a mid-week quota exhaustion never reads as a mysterious "changes".
              echo "> ⏳ **The AI reviewer could not run — this is NOT a review of your code.**"
              echo ">"
              echo "> Almost always the **Claude subscription session quota** is exhausted (also possible: rate-limit / overload). The required \`ai-review\` check is \`action_required\` — it blocks merge only because un-reviewed code must not land — and it **re-runs automatically** when the quota window resets (the \`ai-review-retry\` workflow)."
              echo ">"
              echo "> **Options:**"
              echo "> 1. **Wait** for the quota window to reset — the retry workflow re-reviews automatically."
              echo "> 2. **Fail over to PAYG API** — set repo variable \`AI_REVIEW_FAILOVER=payg\` + secret \`ANTHROPIC_API_KEY\`; re-runs then use pay-as-you-go instead of the subscription quota."
              echo "> 3. Re-run the \`ai-review\` workflow manually once quota is back."
              # #1204 — PERSIST the stated reset time as a machine-readable marker so the
              # retry can schedule against it instead of polling blindly. The CLI states
              # it ("resets 12:50am (Australia/Sydney)") and we previously discarded it,
              # which on #1602 cost six attempts across 4h21m, five of them futile at the
              # moment they fired. A parse failure emits NO marker, and the retry then
              # falls back to its normal cadence — never to "wait forever".
              RESET_ISO=$(printf '%s' "$REVIEWER_OUT" | node -e '
                const fs = require("fs");
                const { parseResetInstant } = require("./.github/scripts/ai-review-guard.js");
                let t = ""; try { t = fs.readFileSync(0, "utf-8"); } catch {}
                const iso = parseResetInstant(t, Date.now());
                if (iso) process.stdout.write(iso);
              ' 2>/dev/null || true)
              if [ -n "$RESET_ISO" ]; then
                echo ">"
                echo "> ⏱️ Reviewer stated the window resets at **$RESET_ISO**; the retry will not spend a token before then."
                echo
                echo "<!-- ai-review-reset: $RESET_ISO -->"
              fi
              det=$(printf '%s\n' "$REVIEWER_OUT" | sed -n '/^[[:space:]]*REVIEW_UNAVAILABLE_BEGIN[[:space:]]*$/,/^[[:space:]]*REVIEW_UNAVAILABLE_END[[:space:]]*$/p' | redact)
              if [ -n "$det" ]; then
                echo
                echo "<details><summary>reviewer output (redacted — may include the reset time)</summary>"
                echo
                echo '```'
                printf '%s\n' "$det"
                echo '```'
                echo "</details>"
              fi
              echo
              echo "_Posted by \`minspec-sdd[bot]\`. Transient/quota failures are surfaced as \`ai-review:blocked\` (distinct from \`ai-review:changes\`) so a token outage never masquerades as a code-review verdict._"
            else
              if [ "$SELF_EDIT" = "yes" ]; then
                if [ "$SELF_EDIT_KIND" = "machinery" ]; then
                  echo "> ⚠️ **This PR modifies the AI-review machinery (\`.github/\`/\`scripts/\`) — the code review still ran; its honest verdict is \`$FINAL\` (above), but a human must review because a gate cannot certify a change to itself.**"
                  echo ">"
                  echo "> The code-review verdict is reported AS-IS — it is **not** masked as \`ai-review:changes\` (#596), so a genuine reviewer-requested change on a machinery PR still surfaces distinctly. Auto-merge is held by a SEPARATE human gate instead: the \`needs-human-review\` label, the \`machinery-review-required\` check, and \`ready-to-merge\` staying red (no SHA-bound pass witness is posted for a machinery PR)."
                else
                  echo "> ⚠️ **The set of changed files could not be verified — auto-pass is disabled (fail closed); a human must review.**"
                  echo ">"
                  echo "> \`on: pull_request\` runs this workflow from the PR head, so a change that cannot be enumerated cannot self-certify. The verdict is forced to \`ai-review:changes\` regardless of the reviewer's output below (which still runs, for information)."
                fi
                echo
              fi
              echo "### Reviewer"
              echo '```'
              printf '%s\n' "$REVIEWER_BLOCK"
              echo '```'
              if [ "$SECURITY_REQUIRED" = "yes" ]; then
                echo
                echo "### Security (code changed)"
                echo '```'
                printf '%s\n' "$SECURITY_BLOCK"
                echo '```'
              fi
              if [ "$ARCHITECT_REQUIRED" = "yes" ]; then
                echo
                echo "### Architect (design / scope)"
                echo '```'
                printf '%s\n' "$ARCHITECT_BLOCK"
                echo '```'
              fi
              if [ "$SKEPTIC_REQUIRED" = "yes" ]; then
                echo
                echo "### Skeptic (evidence discipline)"
                echo '```'
                printf '%s\n' "$SKEPTIC_BLOCK"
                echo '```'
              fi
              echo
              # Coverage DISCLOSURE (no-silent-gate): name the voters that actually ran
              # and, when coverage is reduced, say so IN THE COMMENT. Previously the
              # active mode was echoed only to the CI log, so a repo running a thin
              # panel produced a verdict indistinguishable from a full-panel one — a
              # reduced gate that was invisible on the surface where the decision is
              # consumed (this let a defect through on one repo while the same change
              # was caught on another).
              #
              # Naming only the PRESENT voters was still a silent gate. A docs-only PR
              # posts a three-voter panel that is indistinguishable from a four-voter
              # panel with one voter crashed or misconfigured: the reader sees an
              # absence with no stated cause and cannot tell a deliberate scope rule
              # from a broken one. So every ABSENT voter now carries its reason, and
              # the reasons are single-sourced here rather than restated per mode.
              # >>> coverage-disclosure (executed verbatim by ai-review-coverage-disclosure.test.ts)
              RAN_VOTERS="reviewer"
              SKIPPED_VOTERS=""
              if [ "$SECURITY_REQUIRED" = "yes" ]; then
                RAN_VOTERS="$RAN_VOTERS + security"
              elif [ "$CHANGED_OK" = "yes" ]; then
                SKIPPED_VOTERS="$SKIPPED_VOTERS **security** — docs-only change: every changed file is Markdown, so there is no code surface to review;"
              else
                # SECURITY_REQUIRED=no has TWO causes: the docs-only scope rule above,
                # and a change list that could not be read at all (fetch/diff failure).
                # Claiming "every changed file is Markdown" in the second case would
                # assert a fact this run explicitly failed to establish — and would
                # contradict the indeterminate-diff warning printed earlier in this
                # same comment. The verdict is already fail-closed there; the reason
                # must be too.
                SKIPPED_VOTERS="$SKIPPED_VOTERS **security** — the changed-file list could not be read (\`git diff $BASE...$HEAD\` failed), so its docs-vs-code scope rule could not be evaluated;"
              fi
              if [ "$ARCHITECT_REQUIRED" = "yes" ]; then
                RAN_VOTERS="$RAN_VOTERS + architect"
              else
                SKIPPED_VOTERS="$SKIPPED_VOTERS **architect** — disabled by \`AI_REVIEW_COVERAGE=$COVERAGE\`;"
              fi
              if [ "$SKEPTIC_REQUIRED" = "yes" ]; then
                RAN_VOTERS="$RAN_VOTERS + skeptic"
              else
                SKIPPED_VOTERS="$SKIPPED_VOTERS **skeptic** — disabled by \`AI_REVIEW_COVERAGE=$COVERAGE\`;"
              fi
              SKIPPED_NOTE=""
              [ -n "$SKIPPED_VOTERS" ] && SKIPPED_NOTE=" Did NOT run:${SKIPPED_VOTERS%;}."
              if [ "$COVERAGE" = "panel" ]; then
                COVERAGE_NOTE="Coverage \`$COVERAGE\` — voters that ran: **$RAN_VOTERS**.$SKIPPED_NOTE"
              else
                COVERAGE_NOTE="⚠️ **Reduced coverage** — \`AI_REVIEW_COVERAGE=$COVERAGE\`. Voters that ran: **$RAN_VOTERS**.$SKIPPED_NOTE A \`pass\` here is weaker evidence than a full-panel pass; unset the repo variable to restore the \`panel\` default."
              fi
              # <<< coverage-disclosure
              echo "_Independent fresh-context reviewers (\`scripts/review-branch.sh\`, no-tools agents reading the diff as untrusted data); each label decided by the deterministic fail-closed gate (\`scripts/review-decide.sh\`). Posted by \`minspec-sdd[bot]\` from CI — provenance is the App identity, verified here, not the label alone (#428, #342). $COVERAGE_NOTE The combined verdict fails toward \`changes\` if ANY voter requests changes._"
            fi
          } > "$BODY"
          echo "body-file=$BODY" >> "$GITHUB_OUTPUT"

      # ── Honest, 3-way `ai-review` verdict CHECK-RUN (#480, built on #469) ────
      # The runner job's own success only means "the reviewer RAN" — NOT "the PR
      # PASSED". So post the authoritative `ai-review` check-run whose CONCLUSION
      # MIRRORS THE VERDICT, computed by the tested pure helper decideReviewCheck,
      # now 3-way so `ai-review` is safe to make an ALWAYS-ON REQUIRED ruleset
      # check (#480 — GitHub required checks: `neutral` PASSES, only `failure`
      # blocks):
      #   isMachineryPr → neutral   (self-exempt; wins over the label — a gate
      #                   can't certify a change to itself, so `.github/`/
      #                   `scripts/` PRs stay merge-able and a human reviews)
      #   ai-review:pass → success  (genuinely passed independent review)
      #   anything else  → failure  (BLOCKS the required check — changed from
      #                   #469's `neutral`, which a required check reads as
      #                   passing and so never gated a normal `changes` verdict)
      # `isMachineryPr` reuses the review step's `is_machinery` output, which is
      # the SAME predicate as the self-edit override above (SELF_EDIT_KIND ==
      # "machinery"), not a second definition. Fail-closed: an empty
      # `steps.review.outputs.label` (review step errored) is NOT machinery
      # (defaults false) → failure, never a false neutral/green.
      #
      # ORDERING (#810) — this step runs BEFORE the label is applied, for the same
      # reason #466 posts the `ai-review/pass` status before the label: the
      # ready-to-merge gate fires on the `labeled` event and requires a SHA-bound
      # witness on the head, so the witness must already exist when the gate reads
      # it. This check-run is now that witness (verifyHeadPassCheckRun), and the
      # gate accepts it OR the commit status. Previously this step ran last and
      # beat the gate by only ~1s of Actions queue latency — a race that would have
      # produced an unexplainable red. Do not move it back below the label step.
      #
      # Runs `if: always()` so the check is posted on both the pass and the
      # fail-closed paths, but only when the reviewer is configured. Posted AS THE
      # BOT (App token) to match the comment/label provenance. This check-run is
      # now the intended REQUIRED merge gate for normal PRs (once added to the
      # branch ruleset) — machinery PRs are gated by human review instead, since
      # a gate cannot certify itself. Best-effort: a missing `checks: write` App
      # permission degrades to a warning (the honest check is then simply absent
      # — never a false green), and this step never changes the job's honest
      # status. Only trusted values reach the shell (App token, repo slug, the
      # GitHub-assigned head SHA, and our own gate's label/machinery flag) — no
      # PR-controlled text.
      - name: Post honest `ai-review` verdict check-run as minspec-sdd[bot]
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Our own gate's output (`ai-review:pass` / `ai-review:changes`), NOT any
          # PR-controlled text. Empty if the review step never completed → failure.
          VERDICT_LABEL: ${{ steps.review.outputs.label }}
          # Same machinery predicate as the self-edit override (SELF_EDIT_KIND ==
          # "machinery"), reused via the review step's own output — not a second,
          # divergent definition. Empty/missing (review step never completed)
          # defaults to "false" below, never a false machinery exemption.
          IS_MACHINERY: ${{ steps.review.outputs.is_machinery }}
          # #1728 — the two SHAs the three-dot patch is computed from. GitHub-assigned,
          # never PR-controlled text.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=ai-review check not posted::No App token (mint skipped/failed) — cannot post the ai-review verdict check-run. The label/comment remain authoritative."
            exit 0
          fi
          # Build the check-run body from the TESTED pure helper (single source of
          # truth for machinery→neutral / pass→success / changes→failure). node
          # reads inputs from env, never from an interpolated GitHub Actions
          # expression — injection-safe.
          # (NB: an Actions expression written literally here would be evaluated even
          # inside this shell comment — an empty one fails workflow load; #486.)
          # #1728 — the patch this verdict is ABOUT. Written to a file, not an env var:
          # a diff can exceed the environment size limit, and a truncated patch would
          # fingerprint as a different one. Failure here just yields no marker, which
          # degrades to today's behaviour (always re-review) rather than a wrong match.
          PATCH_FILE="$RUNNER_TEMP/ai-review-patch.txt"
          git diff "$PR_BASE_SHA...$PR_HEAD_SHA" > "$PATCH_FILE" 2>/dev/null || : > "$PATCH_FILE"
          export PATCH_FILE
          BODY="$RUNNER_TEMP/ai-review-check.json"
          # BODY MUST be an ENV var (prefix), not a trailing arg: `node -e '…' BODY=x`
          # makes BODY a positional argv, so `process.env.BODY` is undefined and
          # `writeFileSync(undefined,…)` throws → "Could not compute the verdict
          # check-run body" → the check-run never posted (silently, exit 0). #486-sibling.
          if ! BODY="$BODY" node -e '
            const g = require(process.env.GITHUB_WORKSPACE + "/.github/scripts/ai-review-guard.js");
            const c = g.decideReviewCheck(process.env.VERDICT_LABEL || "", process.env.IS_MACHINERY === "true");
            const fs = require("fs");
            // #1728 — record the THREE-DOT patch fingerprint on the check-run so a
            // later run can tell "this SHA is new" from "this PATCH is new". A
            // forward-merge under `strict` changes the former and not the latter.
            // Recorded here, in App-authored output, for the same reason the witness
            // lives here: it is server-attested provenance, not a mutable comment (#397).
            const fp = g.patchFingerprint(
              (() => { try { return fs.readFileSync(process.env.PATCH_FILE, "utf8"); } catch { return ""; } })(),
            );
            const marker = fp ? "\n\n" + g.renderPatchFingerprint(fp) : "";
            fs.writeFileSync(process.env.BODY, JSON.stringify({
              name: c.name,
              head_sha: process.env.HEAD_SHA,
              status: "completed",
              conclusion: c.conclusion,
              output: { title: c.title, summary: c.summary + marker },
            }));
            process.stderr.write("ai-review verdict=" + (process.env.VERDICT_LABEL || "<none>") + " machinery=" + (process.env.IS_MACHINERY || "false") + " → conclusion=" + c.conclusion + "\n");
          '; then
            echo "::warning title=ai-review check not posted::Could not compute the verdict check-run body. The label/comment remain authoritative."
            exit 0
          fi
          # POST the check-run on the PR head SHA as the bot. Best-effort: a failure
          # (e.g. the App lacks `checks: write`) must NOT red the run.
          if ! gh api -X POST "repos/$REPO/check-runs" --input "$BODY" >/dev/null; then
            echo "::warning title=ai-review check not posted::Posting the ai-review verdict check-run failed (grant the minspec-sdd App \`checks: write\`). The label/comment remain authoritative."
          fi
          exit 0

      # ── SEPARATE, clearly-named machinery human-gate check (#596) ─────────────
      # A machinery PR (touches `.github/`/`scripts/`) now keeps the panel's HONEST
      # `ai-review:*` label (a clean one reads `ai-review:pass`), so the merge hold
      # can no longer ride on a masked `ai-review:changes`. This posts the distinct,
      # requireable `machinery-review-required` check-run on the head SHA:
      #   • is_machinery == true → `action_required` (BLOCKS — a human must review a
      #     change to the review machinery itself; a gate cannot certify itself), and
      #   • otherwise            → `success` (so this check is SAFE to mark REQUIRED in
      #     the branch ruleset without making every non-machinery PR unsatisfiable —
      #     the #560 trap; a sound required check must report on EVERY PR).
      # ADDITIVE and defence-in-depth: `ready-to-merge` (already required) stays red
      # for a machinery PR independently (no SHA-bound pass witness), so the merge hold
      # holds even if this check is never added to the ruleset. Posted AS THE BOT,
      # best-effort: a post failure degrades to a warning and never reds the job. Only
      # trusted values reach the shell (App token, repo slug, GitHub-assigned head SHA,
      # and our own gate's machinery flag) — no PR-controlled text.
      - name: Post `machinery-review-required` human-gate check as minspec-sdd[bot]
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Our own gate's machinery predicate (SELF_EDIT_KIND == "machinery"), reused
          # via the review step output — never PR-controlled text. Empty (review step
          # never completed) defaults to non-machinery → success below; this check can
          # never green-exempt a machinery PR by defaulting, and the job's other
          # fail-closed paths still block.
          IS_MACHINERY: ${{ steps.review.outputs.is_machinery }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=machinery-review-required check not posted::No App token (mint skipped/failed) — cannot post the machinery human-gate check. \`ready-to-merge\` remains the load-bearing hold."
            exit 0
          fi
          if [ "${IS_MACHINERY:-false}" = "true" ]; then
            CONCLUSION=action_required
            TITLE="Machinery PR — human review required"
            SUMMARY="This PR changes the AI-review machinery (\`.github/\` or \`scripts/\`). The independent code review still ran and its honest verdict is on the \`ai-review\` check / label — but a gate cannot certify a change to itself, so a human must review and clear this before merge. \`ready-to-merge\` also stays red until then (#596)."
          else
            CONCLUSION=success
            TITLE="Not a machinery PR — no extra human gate"
            SUMMARY="This PR does not change the AI-review machinery, so no machinery-specific human gate applies. The \`ai-review\` check + \`ready-to-merge\` status remain the merge gate (#596)."
          fi
          # Build the check-run body with node so title/summary are JSON-encoded
          # safely (values are trusted, but this avoids any quoting hazard). node is
          # on PATH whenever setup-node ran; if it did not (an earlier step failed),
          # the `if !` catches the missing binary → warning → exit 0 (non-fatal).
          BODY="$RUNNER_TEMP/machinery-review-check.json"
          if ! CONCLUSION="$CONCLUSION" TITLE="$TITLE" SUMMARY="$SUMMARY" HEAD_SHA="$HEAD_SHA" BODY="$BODY" node -e '
            const fs = require("fs");
            fs.writeFileSync(process.env.BODY, JSON.stringify({
              name: "machinery-review-required",
              head_sha: process.env.HEAD_SHA,
              status: "completed",
              conclusion: process.env.CONCLUSION,
              output: { title: process.env.TITLE, summary: process.env.SUMMARY },
            }));
          '; then
            echo "::warning title=machinery-review-required check not posted::Could not build the check body. \`ready-to-merge\` remains the load-bearing hold."
            exit 0
          fi
          # POST as the bot. Best-effort: a failure (e.g. missing `checks: write`) must
          # NOT red the run — ready-to-merge independently holds a machinery PR.
          if ! gh api -X POST "repos/$REPO/check-runs" --input "$BODY" >/dev/null; then
            echo "::warning title=machinery-review-required check not posted::Posting failed (grant the minspec-sdd App \`checks: write\`). \`ready-to-merge\` remains the load-bearing hold."
          fi
          exit 0

      # Post + label AS THE BOT. GH_TOKEN = App token (this is the ONLY step, with
      # the fail-closed one, that holds it). No CLAUDE_CODE_OAUTH_TOKEN here.
      - name: Post verdict + apply label as minspec-sdd[bot]
        if: steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # #466 — the EXACT SHA this review evaluated, for the SHA-bound pass status.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: ${{ steps.review.outputs.label }}
          # #596 — the SAME machinery predicate the review step computed
          # (SELF_EDIT_KIND == "machinery"). A machinery PR keeps its honest label but
          # must NOT post a success pass witness and MUST pull in a human — driven
          # below off this flag. Empty (review step never completed) ⇒ non-machinery.
          IS_MACHINERY: ${{ steps.review.outputs.is_machinery }}
          BODY_FILE: ${{ steps.review.outputs.body-file }}
          # Human-reviewer fallback for the fail-closed (`ai-review:changes`) path
          # below. Comma-separated logins from the repo variable if set, else the
          # repo owner. Passed via env (never `github.event.pull_request.*`).
          REVIEWERS: ${{ vars.AI_REVIEW_HUMAN_REVIEWERS }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Normalise: `ai-review:pass` and `ai-review:blocked` (reviewer could not
          # run — quota/transient) are the only non-changes states; anything else
          # fails closed to `ai-review:changes` (never a spurious pass).
          case "$LABEL" in
            ai-review:pass|ai-review:blocked) ;;
            *) LABEL="ai-review:changes" ;;
          esac

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"

          if [ "$LABEL" = "ai-review:blocked" ]; then
            gh label create "ai-review:blocked" --repo "$REPO" --color d4c5f9 \
              --description "AI review could not run (quota/transient) — retry-able, not a code verdict" 2>/dev/null || true
          fi

          # ── #466 SHA-bound pass witness ──────────────────────────────────────
          # Post `ai-review/pass` on the EXACT head SHA this review evaluated,
          # BEFORE applying the label. ready-to-merge fires on the `labeled` event
          # and requires this status on the CURRENT head, so posting it first means
          # the SHA-bound witness is present when the gate reads it — closing the
          # TOCTOU where a stale label from an older head could green a newer,
          # unreviewed head. `success` ONLY on a genuine pass; every other verdict
          # (changes / blocked) posts `failure`, so the head SHA always carries a
          # definitive verdict. Best-effort: a failed post leaves NO status ⇒
          # ready-to-merge falls back to the `ai-review` CHECK-RUN witness (#810),
          # and if that is missing too the gate stays red (fail-closed), never a
          # false green.
          #
          # #810 — a SILENTLY swallowed failure here is what made this gate
          # unsatisfiable repo-wide: this POST was returning `403 Resource not
          # accessible by integration` (the App installation lacks `statuses:
          # write`), `|| true` hid it, the label landed anyway, and ready-to-merge —
          # which then accepted ONLY this witness — went red on every genuinely
          # passing PR, so every merge became an `--admin` bypass of the entire
          # required gate. It stays non-fatal (hard-failing here would fail-close
          # EVERY review into `ai-review:changes` over a missing permission), but it
          # must never be silent again: surface an actionable Actions warning.
          # #596 — a MACHINERY PR NEVER posts a `success` pass witness, even when the
          # code review passed. `ai-review:pass` on a machinery PR is the honest CODE
          # verdict, but a gate cannot certify a change to itself, so `ready-to-merge`
          # must stay RED (its SHA-bound witness absent) until a human clears the
          # separate machinery gate. Both head-witness channels are therefore kept
          # non-passing for machinery: this `ai-review/pass` status is `failure`, and
          # the `ai-review` check-run is `neutral` (decideReviewCheck). Non-machinery
          # pass → `success` witness exactly as before.
          if [ "$LABEL" = "ai-review:pass" ] && [ "${IS_MACHINERY:-false}" != "true" ]; then
            PASS_STATE=success
            PASS_DESC="ai-review verdict: $LABEL (bound to this commit)"
          else
            PASS_STATE=failure
            if [ "$LABEL" = "ai-review:pass" ] && [ "${IS_MACHINERY:-false}" = "true" ]; then
              PASS_DESC="ai-review:pass (code) — machinery PR: human gate required, ready-to-merge held red (#596)"
            else
              PASS_DESC="ai-review verdict: $LABEL (bound to this commit)"
            fi
          fi
          if ! gh api "repos/$REPO/statuses/$PR_HEAD_SHA" \
            -f state="$PASS_STATE" \
            -f context="ai-review/pass" \
            -f description="$PASS_DESC" >/dev/null 2>&1; then
            echo "::warning title=ai-review/pass status not posted::Could not post the \`ai-review/pass\` commit status on $PR_HEAD_SHA (usually a missing \`statuses: write\` permission on the minspec-sdd App installation — grant it). The SHA-bound pass witness now falls back to the \`ai-review\` check-run (#810); the gate is not a false green either way."
          fi

          # >>> verdict-label-coherence
          # #1468 — apply the decided verdict label, clear every OTHER verdict label,
          # then VERIFY the post-state instead of assuming it.
          #
          # Each removal used to be best-effort (`2>/dev/null || true`) with BOTH the
          # error and the result discarded. One silently-failed removal left the PR
          # carrying two contradictory verdict labels at once; `ready-to-merge` reads
          # that as "not passed", so a legitimately-passing PR wedged with nothing on
          # its surface explaining why (observed on #1430). Constitution invariant 2
          # forbids exactly that shape: a load-bearing gate signal must not be written
          # with a swallowed error.
          #
          # The rule is the tested pure seam from #1472 (`decideVerdictLabels` /
          # `verdictLabelFault`), loaded from the trusted base checkout — never
          # re-implemented in bash, so the two cannot drift. Individual removals stay
          # tolerant on purpose: the AUTHORITY is the post-state check below, not any
          # single call. The whole reconcile runs twice so a transient label-API
          # failure self-heals instead of reddening the run; a post-state that STILL
          # contradicts fails the step. Loud beats wedged — the backstop then posts
          # the fail-closed verdict and summons a human.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL"

          _verdict_labels_now() {
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name'
          }
          # `$2` picks which of the two seams to evaluate; both read the same module.
          _verdict_rule() {
            CURRENT="$1" VERDICT="$LABEL" WANT="$2" node -e '
              const g = require(process.env.GITHUB_WORKSPACE + "/.github/scripts/ai-review-guard.js");
              const o = {
                current: (process.env.CURRENT || "").split("\n").filter(Boolean),
                verdict: process.env.VERDICT,
              };
              process.stdout.write(
                process.env.WANT === "remove"
                  ? g.decideVerdictLabels(o).remove.join("\n")
                  : g.verdictLabelFault(o) || "",
              );
            '
          }

          VERDICT_FAULT=""
          for _attempt in 1 2; do
            VERDICT_FAULT=""
            # An unreadable label list is NOT "no labels" — saying so would
            # misattribute an API failure as a missing label, which is the same class
            # of lie the swallowed removals told. Distinct message, same fail-closed
            # outcome: an unverifiable post-state is a fault.
            if ! CURRENT_LABELS="$(_verdict_labels_now)"; then
              VERDICT_FAULT="the PR's labels could not be read (GitHub API error), so the verdict post-state is unverifiable"
            else
              REMOVE_LABELS="$(_verdict_rule "$CURRENT_LABELS" remove)" || REMOVE_LABELS=""
              while IFS= read -r _other; do
                [ -n "$_other" ] || continue
                gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$_other" 2>/dev/null || true
              done <<< "$REMOVE_LABELS"

              if ! CURRENT_LABELS="$(_verdict_labels_now)"; then
                VERDICT_FAULT="the PR's labels could not be re-read after reconciling them (GitHub API error), so the verdict post-state is unverifiable"
              else
                VERDICT_FAULT="$(_verdict_rule "$CURRENT_LABELS" fault)" \
                  || VERDICT_FAULT="the verdict-label rule could not be evaluated (ai-review-guard.js errored)"
              fi
            fi
            if [ -z "$VERDICT_FAULT" ]; then break; fi
            if [ "$_attempt" != 2 ]; then sleep 3; fi
          done

          if [ -n "$VERDICT_FAULT" ]; then
            echo "::error title=ai-review verdict labels are contradictory::$VERDICT_FAULT. \`ready-to-merge\` reads a contradictory verdict-label set as \"not passed\", so leaving it would silently wedge this PR with nothing on its surface explaining why (#1468, observed on #1430). Failing the step instead; the fail-closed backstop below posts the verdict."
            exit 1
          fi
          # <<< verdict-label-coherence

          # Summon a human ONLY when a human is GENUINELY the next actor (#816):
          #   • a MACHINERY PR (touches `.github/`/`scripts/`) — a gate cannot certify
          #     a change to itself, so it can NEVER auto-remediate to a green
          #     `ready-to-merge`; a human must clear it (pairs with the
          #     `machinery-review-required` check, #596). Applies whether its honest
          #     code verdict is `ai-review:pass` or `ai-review:changes`.
          #     `needs-human-review` also blocks the agent dispatch path
          #     (scripts/dispatch-ready-check.sh), completing the separate gate.
          # A NORMAL (non-machinery) `ai-review:changes` is no longer flagged here at
          # t=0 (#816 retirement) — but ONLY WHERE THE REMEDIATION LANE EXISTS (the
          # `REMEDIATION_AVAILABLE` probe below): remediate-pr.sh auto-remediates it
          # (bounded attempts) and applies `needs-human-review` ITSELF only at
          # exhaustion (cap / escalate / quarantine / conflict). Where that script is
          # absent the retirement has no delegate, so the eager summon is restored
          # (deny-by-default) rather than routing the PR to nobody. Eager-flagging it
          # WHERE a remediator exists polluted the
          # positive "my turn" queue (`awaiting-approval`, DR-063) with PRs the
          # pipeline fixes on its own — it means "AI review hasn't passed yet", which is
          # not the same as "a human is needed". A retry-able `ai-review:blocked`
          # (quota) never summons a human either — the ai-review-retry workflow re-runs
          # it. This is the ADVISORY label only; `ready-to-merge` stays red
          # INDEPENDENTLY for every un-passed / machinery PR (the load-bearing hold),
          # so retiring the eager label never lets anything merge early. The decision
          # is the SAME tested pure seam (shouldSummonHumanReview) the tests lock, so
          # bash and JS cannot drift. All calls best-effort (`|| true`): the verdict
          # label above is the authoritative signal.
          # Does the remediation lane the #816 retirement delegates to actually
          # exist here? A consuming repo that has not adopted the dispatch lane
          # has no remediate-pr.sh, and retiring the eager summon there would
          # route a flagged PR to nobody. Probed from disk, not assumed.
          REMEDIATION_AVAILABLE=false
          if [ -f "${GITHUB_WORKSPACE}/scripts/remediate-pr.sh" ]; then
            REMEDIATION_AVAILABLE=true
          fi
          SUMMON_HUMAN=$(LABEL="$LABEL" IS_MACHINERY="${IS_MACHINERY:-false}" REMEDIATION_AVAILABLE="$REMEDIATION_AVAILABLE" node -e '
            const g = require(process.env.GITHUB_WORKSPACE + "/.github/scripts/ai-review-guard.js");
            process.stdout.write(
              g.shouldSummonHumanReview({
                label: process.env.LABEL,
                isMachinery: process.env.IS_MACHINERY === "true",
                remediationAvailable: process.env.REMEDIATION_AVAILABLE === "true",
              })
                ? "yes" : "no",
            );
          ' 2>/dev/null || echo "no")
          if [ "$SUMMON_HUMAN" = "yes" ]; then
            REVIEWERS="${REVIEWERS:-$OWNER}"
            gh label create "needs-human-review" --repo "$REPO" \
              --color FBCA04 --description "A human is the next actor — auto-merge withheld" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-human-review" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$REVIEWERS" 2>/dev/null || true
          fi

      # Backstop: if ANY step above errored (install, mint, review, post…), request
      # changes as the bot so an error never yields a green. If the token mint
      # itself failed there is no bot identity to post as — fail red (still no
      # spurious pass), which is the safe outcome.
      - name: Fail closed — request changes as minspec-sdd[bot] on any error
        if: failure() && steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Human-reviewer fallback (see Post step). Repo variable if set, else owner.
          REVIEWERS: ${{ vars.AI_REVIEW_HUMAN_REVIEWERS }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::App token unavailable (mint failed) — cannot post as the bot. Failing red; no spurious pass."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '## 🤖 AI review — `ai-review:changes` (fail-closed)\n\nThe AI review workflow errored before producing a clean verdict, so it is requesting changes. This is a fail-closed default — an error must never yield a green. See the [workflow run](%s).\n\n_Posted by minspec-sdd[bot]._' "$RUN_URL")"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "ai-review:changes"
          # #1468 — clear EVERY other verdict label, not just pass + pending. A PR
          # sitting on `ai-review:blocked` when the workflow errored used to keep that
          # label alongside the new `ai-review:changes`, and `ready-to-merge` reads the
          # contradictory pair as "not passed" — the same wedge, reintroduced by the
          # very path that exists to be the safe way out of it. The list comes from the
          # tested seam (#1472) so this and the post step cannot drift; the literal
          # fallback covers a run where the base checkout is what failed. Everything
          # here stays best-effort — the honest `exit 1` below is the load-bearing part
          # and must not be pre-empted by a label call.
          # >>> backstop-verdict-clear
          for other in $(node -e '
            const g = require(process.env.GITHUB_WORKSPACE + "/.github/scripts/ai-review-guard.js");
            process.stdout.write(g.VERDICT_LABELS.filter((l) => l !== g.CHANGES).join(" "));
          ' 2>/dev/null || echo "ai-review:pass ai-review:blocked ai-review:pending"); do
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$other" 2>/dev/null || true
          done
          # <<< backstop-verdict-clear

          # Fail-closed WORKFLOW ERROR → pull a human in. This is DELIBERATELY kept
          # eager (unlike a normal `ai-review:changes`, whose t=0 human-summon #816
          # retired to remediate-pr.sh's exhaustion path): the workflow itself errored
          # before producing any verdict, so there is no clean review for automation
          # to remediate from — a human must look at the run. All calls are best-effort
          # (`|| true`) and MUST NOT change the honest red status — the `exit 1` below
          # still stands regardless of their outcome.
          REVIEWERS="${REVIEWERS:-$OWNER}"
          gh label create "needs-human-review" --repo "$REPO" \
            --color FBCA04 --description "A human is the next actor — auto-merge withheld" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-human-review" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$REVIEWERS" 2>/dev/null || true
          # Re-fail so the job status honestly reflects the error (label recovered).
          exit 1
